<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titmus Dinámico | Centro Perceptum</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #1e293b;
            --accent: #fbbf24;
        }
        body, html {
            margin:0; padding:0; overflow:hidden; background: var(--bg);
            font-family: 'Montserrat', sans-serif; color: white; height:100vh; width:100vw;
            user-select:none; -webkit-user-select:none;
        }
        .top-bar {
            height: 70px; background: var(--panel); display: flex;
            justify-content: space-between; align-items: center; padding: 0 20px;
            border-bottom: 2px solid #334155;
        }
        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: calc(100vh - 70px); gap: 40px; padding: 20px; box-sizing: border-box;
        }
        /* Fila de los 4 círculos de Wirt */
        .wirt-row {
            display: flex; gap: 40px; justify-content: center; align-items: center;
        }
        .circle-box {
            width: 110px; height: 110px; border-radius: 50%; background: #334155;
            display: flex; align-items: center; justify-content: center; position: relative;
            border: 3px solid #475569; cursor: pointer;
        }
        /* El estímulo que se moverá de izquierda a derecha */
        .target-stimulus {
            width: 50px; height: 50px; border-radius: 50%; background: #ef4444; /* Rojo brillante plano */
            position: absolute; left: calc(50% - 25px); top: calc(50% - 25px);
        }
        .static-stimulus {
            width: 50px; height: 50px; border-radius: 50%; background: #ffffff;
            position: absolute; left: calc(50% - 25px); top: calc(50% - 25px);
        }
        .control-panel {
            background: var(--panel); padding: 15px 30px; border-radius: 15px;
            border: 1px solid #475569; width: 400px; text-align: center;
        }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .btn-back {
            background:#ef4444; color:white; border:none; padding:10px 20px;
            font-weight:900; border-radius:8px; cursor:pointer; text-decoration:none; font-size:0.8rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="btn-back">VOLVER</a>
        <div style="font-weight:900; color:var(--accent); letter-spacing:1px;">TEST DE ESTEREOPSIS DINÁMICA</div>
        <div style="font-size:0.8rem; color:#94a3b8;">DISTANCIA: <b>40 CM</b></div>
    </div>

    <div class="container">
        <h2 style="margin:0; text-align:center; font-weight:700; font-size:1.2rem;">
            ¿Cuál de los círculos se desplaza hacia adelante (FLOTA)?
        </h2>

        <div class="wirt-row">
            <div class="circle-box" onclick="checkAnswer(1)">
                <div class="static-stimulus"></div>
                <span style="position:absolute; bottom:-25px; font-size:0.8rem; color:#64748b;">1</span>
            </div>
            <div class="circle-box" onclick="checkAnswer(2)">
                <div class="static-stimulus"></div>
                <span style="position:absolute; bottom:-25px; font-size:0.8rem; color:#64748b;">2</span>
            </div>
            <div class="circle-box" id="target-box" onclick="checkAnswer(3)">
                <div class="target-stimulus" id="pulsing-target"></div>
                <span style="position:absolute; bottom:-25px; font-size:0.8rem; color:#64748b;">3</span>
            </div>
            <div class="circle-box" onclick="checkAnswer(4)">
                <div class="static-stimulus"></div>
                <span style="position:absolute; bottom:-25px; font-size:0.8rem; color:#64748b;">4</span>
            </div>
        </div>

        <div class="control-panel">
            <label style="display:block; margin-bottom:8px; font-weight:700; font-size:0.9rem;">
                Dificultad (Velocidad): <span id="speed-val" style="color:var(--accent);">Media</span>
            </label>
            <input type="range" id="speed-slider" min="1" max="3" step="1" value="2" oninput="updateSpeed(this.value)">
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:#94a3b8; margin-top:5px;">
                <span>Gruesa (~400")</span><span>Media (~200")</span><span>Fina (~40")</span>
            </div>
        </div>
    </div>

    <script>
        let posX = 0;
        let direction = 1;
        let currentSpeed = 3; // Píxeles por frame de movimiento
        const target = document.getElementById('pulsing-target');

        // Motor de animación de alta precisión (Pendular horizontal)
        function animate() {
            // Límites de oscilación lateral (amplitud de 18 píxeles)
            posX += currentSpeed * direction;
            if (posX > 18 || posX < -18) {
                direction *= -1; 
            }
            target.style.transform = `translateX(${posX}px)`;
            requestAnimationFrame(animate);
        }

        function updateSpeed(val) {
            const txt = document.getElementById('speed-val');
            if (val == 1) {
                txt.innerText = "Gruesa (Movimiento Rápido)";
                txt.style.color = "#f87171";
                currentSpeed = 5; // Más rápido = Mayor disparidad temporal (Fácil)
            } else if (val == 2) {
                txt.innerText = "Media (Movimiento Moderado)";
                txt.style.color = "var(--accent)";
                currentSpeed = 3;
            } else {
                txt.innerText = "Fina (Movimiento Casi Imperceptible)";
                txt.style.color = "#4ade80";
                currentSpeed = 1; // Más lento = Menor disparidad temporal (Difícil)
            }
        }

        function checkAnswer(num) {
            if(num === 3) {
                alert("¡Excelente! Estereofusión confirmada. El círculo 3 flota en el plano Z.");
            } else {
                alert("Incorrecto. Intente nuevamente enfocando el centro de la fila.");
            }
        }

        // Iniciar la animación al cargar la página
        animate();
    </script>
</body>
</html>
